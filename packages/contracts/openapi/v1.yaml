openapi: 3.1.0
info:
  title: iDeliveryFood Platform API
  version: 1.1.0
  description: >
    Versioned HTTP API (/v1) for the iDeliveryFood multi-tenant food delivery marketplace.
    Enforces integer cents (BRL), America/Sao_Paulo operational timezone, i18n (en default, pt-BR),
    strict RBAC/ABAC/RLS, and MFA aal2 step-up for sensitive mutations.
servers:
  - url: http://localhost:4000/v1
    description: Local Development API
paths:
  /health/live:
    get:
      operationId: getLiveness
      summary: Liveness probe
      responses:
        "200":
          description: Process is alive
  /health/ready:
    get:
      operationId: getReadiness
      summary: Readiness probe including Supabase connectivity and external provider status
      responses:
        "200":
          description: Service readiness report
  /system/providers:
    get:
      operationId: listProviderStatuses
      summary: Honest readiness status for pre-configured external providers (PSP, Maps, Push, Email)
      responses:
        "200":
          description: Provider readiness list
  /me:
    get:
      operationId: getCurrentProfile
      summary: Get authenticated actor profile, active tenant memberships, and staff scopes
      responses:
        "200":
          description: Authenticated profile envelope
        "401":
          description: Unauthenticated
  /me/preferences:
    patch:
      operationId: updateMyPreferences
      summary: Update user locale (en or pt-BR) and notification preferences in Supabase
      responses:
        "200":
          description: Updated preferences
  /me/addresses:
    get:
      operationId: listCustomerAddresses
      summary: List saved customer delivery addresses
      responses:
        "200":
          description: List of addresses
    post:
      operationId: createCustomerAddress
      summary: Save a new customer delivery address with coordinates
      responses:
        "201":
          description: Address created
  /me/devices/revoke:
    post:
      operationId: revokeUserDevice
      summary: Revoke a registered device session and push token
      responses:
        "200":
          description: Device revoked
  /me/privacy-requests:
    post:
      operationId: createPrivacyRequest
      summary: Submit LGPD export, anonymization, or account deletion request (checks legal hold)
      responses:
        "201":
          description: Privacy request recorded
  /organizations/{orgId}/members:
    get:
      operationId: listOrganizationMembers
      summary: List members scoped to a merchant organization
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Scoped organization members
        "403":
          description: Cross-tenant access denied
  /organizations/{orgId}/units-summary:
    get:
      operationId: getMultiUnitSummary
      summary: Consolidated multi-unit operational summary restricted to actor's authorized stores (M09)
      responses:
        "200":
          description: Multi-unit summary
  /organizations/{orgId}/catalog-batch:
    post:
      operationId: applyMultiUnitCatalogBatch
      summary: Apply batch product availability or price update across multiple units with partial status report (M09)
      responses:
        "200":
          description: Per-unit batch execution results
  /invitations:
    post:
      operationId: createInvitation
      summary: Issue a single-use expiring invitation for partner or staff membership
      responses:
        "201":
          description: Invitation created
  /invitations/accept:
    post:
      operationId: acceptInvitation
      summary: Consume a valid single-use invitation token
      responses:
        "200":
          description: Invitation accepted
  /onboarding/approvals:
    post:
      operationId: recordOnboardingApproval
      summary: Approve, reject, or suspend a merchant store or courier (requires staff MFA aal2)
      responses:
        "200":
          description: Approval decision recorded and audited
  /stores:
    get:
      operationId: listPublishedStores
      summary: List active published stores from Supabase with search, cuisine filter, and coverage evaluation (M04)
      responses:
        "200":
          description: Paginated published stores
  /stores/{storeId}/catalog:
    get:
      operationId: getStoreCatalog
      summary: Get store details, operating availability, categories, products, and option groups (M04/M05)
      responses:
        "200":
          description: Store catalog and availability
  /stores/{storeId}/availability:
    get:
      operationId: evaluateStoreAvailabilityAndCoverage
      summary: Evaluate store operating schedule in America/Sao_Paulo and Haversine radius coverage (M04)
      responses:
        "200":
          description: Store availability and service area eligibility
  /quotes:
    post:
      operationId: calculateQuote
      summary: Calculate and persist an authoritative server-side quote in integer BRL cents with TTL (M04/M10)
      responses:
        "201":
          description: Immutable quote snapshot
  /orders:
    post:
      operationId: createOrderFromQuote
      summary: Create an idempotent order from an unexpired, unconsumed server quote (M10)
      responses:
        "201":
          description: Order created
  /orders/{orderId}:
    get:
      operationId: getOrderById
      summary: Retrieve order details and immutable snapshots for authorized actor (M10)
      responses:
        "200":
          description: Order record
  /orders/{orderId}/commands:
    post:
      operationId: executeOrderStateCommand
      summary: Execute a state transition command (ACCEPT, REJECT, START_PREPARING, MARK_READY, CANCEL) with expectedVersion optimistic locking (M10)
      responses:
        "200":
          description: Updated order state and appended event
        "409":
          description: Optimistic concurrency version conflict or invalid state transition
  /orders/{orderId}/events:
    get:
      operationId: listOrderEvents
      summary: List append-only order state transition events (M10)
      responses:
        "200":
          description: Ordered list of order events
  /payments/attempts:
    post:
      operationId: createPaymentAttempt
      summary: Create an idempotent payment attempt or return honest BLOCKED_MISSING_CREDENTIALS error when PSP is unconfigured (M12)
      responses:
        "201":
          description: Payment attempt recorded
        "503":
          description: External PSP provider is BLOCKED_MISSING_CREDENTIALS
  /webhooks/psp/{providerCode}:
    post:
      operationId: handlePspWebhook
      summary: Verify HMAC signature, timestamp replay window, deduplicate event, and reconcile order payment state (M12)
      responses:
        "200":
          description: Webhook processed or deduplicated
        "401":
          description: Invalid webhook signature or timestamp outside tolerance window
  /refunds:
    post:
      operationId: createRefund
      summary: Request or approve a partial/full refund with ABAC ceiling and MFA aal2 verification (M12)
      responses:
        "201":
          description: Refund recorded and reversal ledger entries generated
  /stores/{storeId}/settings:
    patch:
      operationId: updateStoreSettings
      summary: Update store pause status, prep time bounds, and minimum order in BRL cents (M07)
      responses:
        "200":
          description: Store settings updated
  /stores/{storeId}/bank-account-change-request:
    post:
      operationId: requestBankAccountChange
      summary: Submit a PENDING bank account change request requiring partner_owner + MFA aal2 (M07)
      responses:
        "201":
          description: Pending bank account approval request recorded
  /stores/{storeId}/orders-queue:
    get:
      operationId: getStoreOrdersQueue
      summary: Retrieve live kitchen order console queue with SLA countdowns and pause resilience (M08)
      responses:
        "200":
          description: Kitchen order queue grouped by operational column
  /admin/staff-scopes:
    post:
      operationId: grantStaffScope
      summary: Grant a staff role scope (requires tech_admin + MFA aal2 + justification; blocks self-grant) (M16)
      responses:
        "201":
          description: Staff scope granted and audited
  /admin/governance-actions:
    post:
      operationId: executeAdminGovernanceAction
      summary: Execute approval, rejection, suspension, or reactivation decision with MFA aal2 (M16)
      responses:
        "201":
          description: Governance decision recorded in immutable audit trail
  /admin/audit-logs:
    get:
      operationId: listAdminAuditLogs
      summary: Retrieve read-only immutable audit logs for authorized compliance/admin roles (M16)
      responses:
        "200":
          description: List of audit log records
  /finance/reconciliation-runs:
    post:
      operationId: runPspReconciliation
      summary: Execute PSP vs internal ledger reconciliation run in BRL integer cents (M13)
      responses:
        "201":
          description: Reconciliation run completed with matched and discrepancy counts
  /finance/settlements/{settlementId}/execute:
    post:
      operationId: executeSettlementPayout
      summary: Execute merchant or courier settlement payout enforcing MFA aal2, segregation of duties, and honest BLOCKED_NO_PSP status (M13)
      responses:
        "200":
          description: Settlement status updated (PAID_CONFIRMED or BLOCKED_NO_PSP)
        "403":
          description: Segregation of duties violation or missing MFA aal2
  /logistics/offers:
    post:
      operationId: createDeliveryOffer
      summary: Create a delivery task and courier offer hiding exact street until accepted (M14)
      responses:
        "201":
          description: Delivery offer created
  /logistics/offers/{offerId}/accept:
    post:
      operationId: acceptDeliveryOffer
      summary: Accept a delivery offer transactionally enforcing single active courier and revealing full customer address (M14/M11)
      responses:
        "200":
          description: Offer accepted and full dropoff address revealed
        "409":
          description: Offer expired, courier offline, or task already assigned to another courier
  /logistics/location-samples:
    post:
      operationId: submitCourierLocationSample
      summary: Record courier GPS location sample with staleness and accuracy validation (M14/M11)
      responses:
        "201":
          description: Location sample recorded with isStaleOrLowAccuracy flag
  /logistics/tasks/{taskId}/complete:
    post:
      operationId: completeDeliveryTaskWithOtp
      summary: Complete a delivery task by verifying the 4-digit customer OTP proof-of-delivery code (M14/M11)
      responses:
        "200":
          description: Delivery task marked DELIVERED
        "409":
          description: Invalid 4-digit OTP code
  /stores/{storeId}:
    get:
      operationId: getStoreDetail
      summary: Retrieve published store detail by ID or slug along with active catalog, availability, hours, exceptions, and service areas (M04)
      responses:
        "200":
          description: Published store detail and catalog
  /partner/stores/{storeId}:
    patch:
      operationId: updatePartnerStore
      summary: Update store profile, modalities, pause status, and preparation time bounds (M07)
      responses:
        "200":
          description: Store updated
  /partner/stores/{storeId}/hours:
    get:
      operationId: getPartnerStoreHours
      summary: Retrieve store weekly operating hours and exceptions (M07)
      responses:
        "200":
          description: Weekly hours and exceptions
    put:
      operationId: replacePartnerStoreHours
      summary: Replace store weekly operating hours in America/Sao_Paulo (M07)
      responses:
        "200":
          description: Weekly hours updated
  /partner/stores/{storeId}/hour-exceptions:
    post:
      operationId: upsertPartnerStoreHourException
      summary: Create or update a holiday/special schedule exception (M07)
      responses:
        "201":
          description: Hour exception upserted
  /partner/stores/{storeId}/hour-exceptions/{exceptionDate}:
    delete:
      operationId: deletePartnerStoreHourException
      summary: Delete a store schedule exception by date (M07)
      responses:
        "200":
          description: Hour exception deleted
  /partner/stores/{storeId}/service-areas:
    get:
      operationId: listPartnerStoreServiceAreas
      summary: List store delivery coverage areas and fee tiers (M04/M07)
      responses:
        "200":
          description: Service areas list
    post:
      operationId: createPartnerStoreServiceArea
      summary: Create a new store service area with integer BRL centavo fee rules (M04/M07)
      responses:
        "201":
          description: Service area created
  /partner/stores/{storeId}/service-areas/{areaId}:
    patch:
      operationId: updatePartnerStoreServiceArea
      summary: Update a store service area (M04/M07)
      responses:
        "200":
          description: Service area updated
    delete:
      operationId: deletePartnerStoreServiceArea
      summary: Delete a store service area (M04/M07)
      responses:
        "200":
          description: Service area deleted
  /partner/stores/{storeId}/categories:
    get:
      operationId: listPartnerStoreCategories
      summary: List store catalog categories (M04/M07)
      responses:
        "200":
          description: Categories list
    post:
      operationId: createPartnerStoreCategory
      summary: Create a catalog category with bilingual names (en and pt-BR) (M04/M07)
      responses:
        "201":
          description: Category created
  /partner/stores/{storeId}/categories/{categoryId}:
    patch:
      operationId: updatePartnerStoreCategory
      summary: Update a catalog category (M04/M07)
      responses:
        "200":
          description: Category updated
    delete:
      operationId: deletePartnerStoreCategory
      summary: Delete a catalog category (M04/M07)
      responses:
        "200":
          description: Category deleted
  /partner/stores/{storeId}/products:
    get:
      operationId: listPartnerStoreProducts
      summary: List store catalog products (M04/M07)
      responses:
        "200":
          description: Products list
    post:
      operationId: createPartnerStoreProduct
      summary: Create a catalog product priced in integer BRL cents (M04/M07)
      responses:
        "201":
          description: Product created
  /partner/stores/{storeId}/products/{productId}:
    patch:
      operationId: updatePartnerStoreProduct
      summary: Update a catalog product (M04/M07)
      responses:
        "200":
          description: Product updated
    delete:
      operationId: deletePartnerStoreProduct
      summary: Delete a catalog product (M04/M07)
      responses:
        "200":
          description: Product deleted
  /partner/products/{productId}/option-groups:
    post:
      operationId: createCatalogOptionGroup
      summary: Create an option group on a product enforcing minSelections <= maxSelections (M04/M07)
      responses:
        "201":
          description: Option group created
  /partner/products/{productId}/option-groups/{groupId}:
    patch:
      operationId: updateCatalogOptionGroup
      summary: Update a product option group (M04/M07)
      responses:
        "200":
          description: Option group updated
    delete:
      operationId: deleteCatalogOptionGroup
      summary: Delete a product option group (M04/M07)
      responses:
        "200":
          description: Option group deleted
  /partner/products/{productId}/option-groups/{groupId}/options:
    post:
      operationId: createCatalogOption
      summary: Create an option modifier priced in integer BRL cents (M04/M07)
      responses:
        "201":
          description: Option created
  /partner/products/{productId}/options/{optionId}:
    patch:
      operationId: updateCatalogOption
      summary: Update a catalog option modifier (M04/M07)
      responses:
        "200":
          description: Option updated
    delete:
      operationId: deleteCatalogOption
      summary: Delete a catalog option modifier (M04/M07)
      responses:
        "200":
          description: Option deleted
  /organizations/{orgId}/catalog/batch:
    post:
      operationId: executeMultiUnitCatalogBatchV2
      summary: Execute or preview (dryRun) a multi-unit catalog batch update persisted in PostgreSQL (M09)
      responses:
        "200":
          description: Batch catalog update results per target store
  /storage/signed-upload-url:
    post:
      operationId: createSignedUploadUrl
      summary: Generate a signed upload URL validating bucket, MIME type, file size limit, and tenant scope (M02/M07)
      responses:
        "201":
          description: Signed upload URL and upload intent created
components:
  schemas:
    ApiErrorEnvelope:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
            - correlationId
            - timestamp
          properties:
            code:
              type: string
            message:
              type: string
            correlationId:
              type: string
            timestamp:
              type: string
              format: date-time
            details:
              type: object
