      responses:
        "201":
          description: Signed upload URL and upload intent created
  /security/webhooks/validate-target:
    post:
      operationId: validateExternalWebhookTargetAgainstSsrf
      summary: Validate an outbound webhook URL against SSRF (blocks non-HTTPS, loopback, RFC 1918 private IPs, link-local 169.254.169.254 metadata, and internal hosts) (M23)
      responses:
        "200":
          description: Target URL passed SSRF validation
        "400":
          description: Target URL blocked by SSRF policy
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Supabase Auth HS256 JWT containing sub, email, and aal ('aal1' | 'aal2').
  parameters:
    IdempotencyKeyHeader:
      name: X-Idempotency-Key
      in: header
      required: true
      description: Unique idempotency key (minimum 8 characters) preventing duplicate mutations on retry.
      schema:
        type: string
        minLength: 8
    CorrelationIdHeader:
      name: X-Correlation-Id
      in: header
      required: false
      description: End-to-end request correlation identifier (validated against CRLF injection).
      schema:
        type: string
        pattern: "^[A-Za-z0-9._:-]{6,128}$"
    AcceptLanguageHeader:
      name: Accept-Language
      in: header
      required: false
      description: Supported locale ('en' default, 'pt-BR' selectable).
      schema:
        type: string
        enum: [en, pt-BR]
  schemas:
    ApiErrorEnvelope:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
            - correlationId
            - timestamp
          properties:
            code:
              type: string
            message:
              type: string
            correlationId:
              type: string
            timestamp:
              type: string
              format: date-time
