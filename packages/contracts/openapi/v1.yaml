openapi: 3.1.0
info:
  title: iDeliveryFood Platform API
  version: 1.2.0
  description: >
    Complete versioned HTTP API (/v1) specification for the iDeliveryFood multi-tenant food & grocery delivery marketplace (M00–M26).
    Enforces integer cents in Brazilian Real (BRL), America/Sao_Paulo operational timezone, bilingual localization (en default, pt-BR),
    strict RBAC/ABAC/RLS multi-tenant isolation, idempotency (X-Idempotency-Key), end-to-end correlation (X-Correlation-Id),
    and MFA step-up (aal2) with 4-eyes Segregation of Duties for sensitive financial and governance mutations.
servers:
  - url: http://localhost:4000/v1
    description: Local & Integration API Server (/v1)
security:
  - bearerAuth: []
paths:
  /health/live:
    get:
      operationId: getLiveness
      summary: Liveness probe (M01/M25)
      security: []
      responses:
        "200":
          description: Process is alive
  /health/ready:
    get:
      operationId: getReadiness
      summary: Readiness probe including Supabase project ref, timezone, currency, and external provider readiness (M01/M25)
      security: []
      responses:
        "200":
          description: Service readiness report
  /system/providers:
    get:
      operationId: listProviderStatuses
      summary: Honest readiness status for pre-configured external providers (PSP, Maps, Push, Email, SMS, KYC) (M01/M12/M20)
      security: []
      responses:
        "200":
          description: Provider readiness list
  /metrics:
    get:
      operationId: getOperationalMetrics
      summary: Return HTTP latency percentiles (p50/p95/p99), PSP webhook failures, outbox backlog, DEAD_LETTER count, reconciliation status, and SLI/SLO alerts in JSON or Prometheus format (M25, tech_admin/operations + MFA aal2)
      parameters:
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum: [json, prometheus]
      responses:
        "200":
          description: Operational metrics and active alerts report
        "401":
          description: Unauthenticated
        "403":
          description: Missing tech_admin/operations role or MFA aal2 step-up
  /me:
    get:
      operationId: getCurrentProfile
      summary: Get authenticated actor profile, active tenant memberships, and staff scopes (M03)
      responses:
        "200":
          description: Authenticated profile envelope
        "401":
          description: Unauthenticated
  /me/preferences:
    patch:
      operationId: updateMyPreferences
      summary: Update user locale (en or pt-BR) and notification opt-in preferences in Supabase (M01/M03/M20)
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      responses:
        "200":
          description: Updated preferences
  /me/addresses:
    get:
      operationId: listCustomerAddresses
      summary: List saved customer delivery addresses (M05)
      responses:
        "200":
          description: List of addresses
    post:
      operationId: createCustomerAddress
      summary: Save a new customer delivery address with coordinates (M05)
      responses:
        "201":
          description: Address created
  /me/devices:
    get:
      operationId: listMyDevices
      summary: List registered mobile/web devices and push consent status for the authenticated user (M03/M20)
      responses:
        "200":
          description: List of user devices
  /me/devices/revoke:
    post:
      operationId: revokeUserDevice
      summary: Immediately revoke a registered device session, clear push_token, and enqueue security.device_revoked outbox event (M03/M20)
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      responses:
        "200":
          description: Device revoked and push token cleared
  /me/notifications:
    get:
      operationId: listMyNotifications
      summary: List in-app/push/email notification deliveries for the authenticated user with Realtime cursor recovery (?sinceCursor=) (M20)
      parameters:
        - name: sinceCursor
          in: query
          required: false
          schema:
            type: integer
        - name: unreadOnly
          in: query
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: Scoped notifications and latestCursorSeq
  /me/notifications/{notificationId}/read:
    post:
      operationId: markMyNotificationRead
      summary: Mark a notification delivery as READ for the authenticated recipient (M20)
      responses:
        "200":
          description: Notification marked as read
        "404":
          description: Notification not found for actor
  /me/privacy-requests:
    post:
      operationId: createPrivacyRequest
      summary: Submit LGPD Art. 18 data portability export, anonymization, or account deletion request with legal retention hold check (M03/M21)
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      responses:
        "201":
          description: Privacy request recorded
  /me/lgpd-export:
    get:
      operationId: getMyLgpdPortabilityPackage
      summary: Generate structured JSON LGPD Art. 18 V data portability package for the authenticated user (M21)
      responses:
        "200":
          description: Structured LGPD portability package
  /organizations/{orgId}/members:
    get:
      operationId: listOrganizationMembers
      summary: List members scoped to a merchant organization (M03/M07)
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Scoped organization members
        "403":
          description: Cross-tenant access denied
  /organizations/{orgId}/units-summary:
    get:
      operationId: getMultiUnitSummary
      summary: Consolidated multi-unit operational summary restricted to actor's authorized stores (M09)
      responses:
        "200":
          description: Multi-unit summary
  /organizations/{orgId}/catalog-batch:
    post:
      operationId: applyMultiUnitCatalogBatch
      summary: Apply batch product availability or price update across multiple units with partial status report (M09)
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      responses:
        "200":
          description: Per-unit batch execution results
  /organizations/{orgId}/catalog/batch:
    post:
      operationId: executeMultiUnitCatalogBatchV2
      summary: Execute or preview (dryRun) a multi-unit catalog batch update persisted in PostgreSQL (M09)
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      responses:
        "200":
          description: Batch catalog update results per target store
  /organizations/{orgId}/contract:
    get:
      operationId: getOrganizationMerchantContract
      summary: Retrieve active versioned merchant contract and commission rules for an organization (M07/M18)
      responses:
        "200":
          description: Merchant contract record
  /organizations/{orgId}/commission-rules:
    get:
      operationId: listOrganizationCommissionRuleVersions
      summary: List versioned commission rules history (platform delivery, merchant delivery, pickup, service fee in bps) for an organization (M18)
      responses:
        "200":
          description: Versioned commission rules list
  /invitations:
    post:
      operationId: createInvitation
      summary: Issue a single-use expiring invitation for partner or staff membership (M03/M07)
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      responses:
        "201":
          description: Invitation created
  /invitations/accept:
    post:
      operationId: acceptInvitation
      summary: Consume a valid single-use invitation token (M03/M07)
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      responses:
        "200":
          description: Invitation accepted
  /onboarding/approvals:
    post:
      operationId: recordOnboardingApproval
      summary: Approve, reject, or suspend a merchant store or courier (requires staff MFA aal2) (M03/M16)
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      responses:
        "200":
          description: Approval decision recorded and audited
  /stores:
    get:
      operationId: listPublishedStores
      summary: List active published stores from Supabase with search, cuisine filter, and coverage evaluation (M04/M05)
      security: []
      responses:
        "200":
          description: Paginated published stores
  /stores/{storeId}:
    get:
      operationId: getStoreDetail
      summary: Retrieve published store detail by ID or slug along with active catalog, availability, hours, exceptions, and service areas (M04/M05)
      security: []
      responses:
        "200":
          description: Published store detail and catalog
  /stores/{storeId}/catalog:
    get:
      operationId: getStoreCatalog
      summary: Get store details, operating availability, categories, products, and option groups (M04/M05)
      security: []
      responses:
        "200":
          description: Store catalog and availability
  /stores/{storeId}/availability:
    get:
      operationId: evaluateStoreAvailabilityAndCoverage
      summary: Evaluate store operating schedule in America/Sao_Paulo and Haversine radius coverage (M04)
      security: []
      responses:
        "200":
          description: Store availability and service area eligibility
  /stores/{storeId}/reviews:
    get:
      operationId: listPublicStoreReviews
      summary: List published verified customer reviews for a store (M05/M19)
      security: []
      responses:
        "200":
          description: Published store reviews
  /stores/{storeId}/settings:
    patch:
      operationId: updateStoreSettings
      summary: Update store pause status, prep time bounds, and minimum order in BRL cents (M07)
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      responses:
        "200":
          description: Store settings updated
  /stores/{storeId}/bank-account-change-request:
    post:
      operationId: requestBankAccountChange
      summary: Submit a PENDING bank account change request requiring partner_owner + MFA aal2 (M07/M13)
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      responses:
        "201":
          description: Pending bank account approval request recorded
  /stores/{storeId}/orders-queue:
    get:
      operationId: getStoreOrdersQueue
      summary: Retrieve live kitchen order console (KDS) queue with SLA countdowns and pause resilience (M08)
      responses:
        "200":
          description: Kitchen order queue grouped by operational column
  /quotes:
    post:
      operationId: calculateQuote
      summary: Calculate and persist an authoritative server-side quote in integer BRL cents with TTL (M04/M10)
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      responses:
        "201":
          description: Immutable quote snapshot
  /orders:
    post:
      operationId: createOrderFromQuote
      summary: Create an idempotent order from an unexpired, unconsumed server quote (M10)
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      responses:
        "201":
          description: Order created
  /orders/{orderId}:
    get:
      operationId: getOrderById
      summary: Retrieve order details and immutable snapshots for authorized actor (M10)
      responses:
        "200":
          description: Order record
        "403":
          description: Cross-customer or cross-tenant access denied
  /orders/{orderId}/commands:
    post:
      operationId: executeOrderStateCommand
      summary: Execute a state transition command (ACCEPT, REJECT, START_PREPARING, MARK_READY, PICK_UP, DELIVER, COMPLETE, CANCEL) with expectedVersion optimistic locking (M10)
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      responses:
        "200":
          description: Updated order state and appended event
        "409":
          description: Optimistic concurrency version conflict or invalid state transition
  /orders/{orderId}/events:
    get:
      operationId: listOrderEvents
      summary: List append-only order state transition events (M10)
      responses:
        "200":
          description: Ordered list of order events
  /orders/{orderId}/reviews:
    post:
      operationId: createVerifiedOrderReview
      summary: Submit a verified post-order review (requires order owner and DELIVERED/COMPLETED order status) (M05/M19)
      responses:
        "201":
          description: Verified order review created
  /orders/{orderId}/support-cases:
    post:
      operationId: createOrderSupportCase
      summary: Open a support ticket linked to an order with automatic category-based SLA calculation (M05/M17)
      responses:
        "201":
          description: Support case opened
  /orders/{orderId}/picking:
    get:
      operationId: getOrderGroceryPickingDetail
      summary: Retrieve variable-weight picking items, scale weights, and pending substitutions for an order (M22)
      responses:
        "200":
          description: Order grocery picking detail
  /orders/{orderId}/substitutions/{substitutionId}/respond:
    post:
      operationId: respondToOrderItemSubstitution
      summary: Customer approves or rejects a proposed grocery item substitution before timeout expiration (M22)
      responses:
        "200":
          description: Substitution decision recorded
  /payments/attempts:
    post:
      operationId: createPaymentAttempt
      summary: Create an idempotent payment attempt or return honest BLOCKED_MISSING_CREDENTIALS error when PSP is unconfigured (M12)
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      responses:
        "201":
          description: Payment attempt recorded
        "503":
          description: External PSP provider is BLOCKED_MISSING_CREDENTIALS
  /webhooks/psp/{providerCode}:
    post:
      operationId: handlePspWebhook
      summary: Verify HMAC-SHA256 signature, 300s timestamp replay window, deduplicate event atomically, and reconcile order payment state & double-entry ledger journal (M12/M13)
      security: []
      responses:
        "200":
          description: Webhook processed or deduplicated
        "401":
          description: Invalid webhook signature or timestamp outside tolerance window
  /refunds:
    post:
      operationId: createRefund
      summary: Request or approve a partial/full refund with ABAC ceiling, MFA aal2 verification, and proportional ORDER_REFUND ledger reversal (M12/M13)
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      responses:
        "201":
          description: Refund recorded and reversal ledger entries generated
  /partner/stores/{storeId}:
    patch:
      operationId: updatePartnerStore
      summary: Update store profile, modalities, pause status, and preparation time bounds (M07)
      responses:
        "200":
          description: Store updated
  /partner/stores/{storeId}/hours:
    get:
      operationId: getPartnerStoreHours
      summary: Retrieve store weekly operating hours and exceptions (M07)
      responses:
        "200":
          description: Weekly hours and exceptions
    put:
      operationId: replacePartnerStoreHours
      summary: Replace store weekly operating hours in America/Sao_Paulo (M07)
      responses:
        "200":
          description: Weekly hours updated
  /partner/stores/{storeId}/hour-exceptions:
    post:
      operationId: upsertPartnerStoreHourException
      summary: Create or update a holiday/special schedule exception (M07)
      responses:
        "201":
          description: Hour exception upserted
  /partner/stores/{storeId}/hour-exceptions/{exceptionDate}:
    delete:
      operationId: deletePartnerStoreHourException
      summary: Delete a store schedule exception by date (M07)
      responses:
        "200":
          description: Hour exception deleted
  /partner/stores/{storeId}/service-areas:
    get:
      operationId: listPartnerStoreServiceAreas
      summary: List store delivery coverage areas and fee tiers (M04/M07)
      responses:
        "200":
          description: Service areas list
    post:
      operationId: createPartnerStoreServiceArea
      summary: Create a new store service area with integer BRL centavo fee rules (M04/M07)
      responses:
        "201":
          description: Service area created
  /partner/stores/{storeId}/service-areas/{areaId}:
    patch:
      operationId: updatePartnerStoreServiceArea
      summary: Update a store service area (M04/M07)
      responses:
        "200":
          description: Service area updated
    delete:
      operationId: deletePartnerStoreServiceArea
      summary: Delete a store service area (M04/M07)
      responses:
        "200":
          description: Service area deleted
  /partner/stores/{storeId}/categories:
    get:
      operationId: listPartnerStoreCategories
      summary: List store catalog categories (M04/M07)
      responses:
        "200":
          description: Categories list
    post:
      operationId: createPartnerStoreCategory
      summary: Create a catalog category with bilingual names (en and pt-BR) (M04/M07)
      responses:
        "201":
          description: Category created
  /partner/stores/{storeId}/categories/{categoryId}:
    patch:
      operationId: updatePartnerStoreCategory
      summary: Update a catalog category (M04/M07)
      responses:
        "200":
          description: Category updated
    delete:
      operationId: deletePartnerStoreCategory
      summary: Delete a catalog category (M04/M07)
      responses:
        "200":
          description: Category deleted
  /partner/stores/{storeId}/products:
    get:
      operationId: listPartnerStoreProducts
      summary: List store catalog products (M04/M07)
      responses:
        "200":
          description: Products list
    post:
      operationId: createPartnerStoreProduct
      summary: Create a catalog product priced in integer BRL cents (M04/M07)
      responses:
        "201":
          description: Product created
  /partner/stores/{storeId}/products/{productId}:
    patch:
      operationId: updatePartnerStoreProduct
      summary: Update a catalog product (M04/M07)
      responses:
        "200":
          description: Product updated
    delete:
      operationId: deletePartnerStoreProduct
      summary: Delete a catalog product (M04/M07)
      responses:
        "200":
          description: Product deleted
  /partner/products/{productId}/option-groups:
    post:
      operationId: createCatalogOptionGroup
      summary: Create an option group on a product enforcing minSelections <= maxSelections (M04/M07)
      responses:
        "201":
          description: Option group created
  /partner/products/{productId}/option-groups/{groupId}:
    patch:
      operationId: updateCatalogOptionGroup
      summary: Update a product option group (M04/M07)
      responses:
        "200":
          description: Option group updated
    delete:
      operationId: deleteCatalogOptionGroup
      summary: Delete a product option group (M04/M07)
      responses:
        "200":
          description: Option group deleted
  /partner/products/{productId}/option-groups/{groupId}/options:
    post:
      operationId: createCatalogOption
      summary: Create an option modifier priced in integer BRL cents (M04/M07)
      responses:
        "201":
          description: Option created
  /partner/products/{productId}/options/{optionId}:
    patch:
      operationId: updateCatalogOption
      summary: Update a catalog option modifier (M04/M07)
      responses:
        "200":
          description: Option updated
    delete:
      operationId: deleteCatalogOption
      summary: Delete a catalog option modifier (M04/M07)
      responses:
        "200":
          description: Option deleted
  /partner/stores/{storeId}/finance:
    get:
      operationId: getPartnerStoreFinanceLedger
      summary: Retrieve store financial statement, commission split, and payouts (restricted to partner_owner and partner_finance) (M07/M13)
      responses:
        "200":
          description: Store financial statement
        "403":
          description: Denied for partner_operator/partner_catalog (role segregation)
  /partner/stores/{storeId}/reviews:
    get:
      operationId: listPartnerStoreReviews
      summary: List store customer reviews for partner management (M07/M19)
      responses:
        "200":
          description: Store reviews list
  /partner/stores/{storeId}/reviews/{reviewId}/reply:
    post:
      operationId: replyToStoreReview
      summary: Publish an official merchant reply to a verified customer review (M07/M19)
      responses:
        "200":
          description: Review updated with partner reply
  /partner/stores/{storeId}/support-cases:
    get:
      operationId: listPartnerStoreSupportCases
      summary: List support cases associated with a store (internal staff notes stripped) (M07/M17)
      responses:
        "200":
          description: Scoped support cases
  /partner/stores/{storeId}/picking:
    get:
      operationId: getStoreGroceryPickingOverview
      summary: List grocery picking tasks and substitutions for a store (requires feature_grocery_picking_enabled) (M22)
      responses:
        "200":
          description: Store grocery picking overview
        "403":
          description: FEATURE_DISABLED_BY_POLICY or cross-tenant store access
  /partner/stores/{storeId}/picking/tasks:
    post:
      operationId: startStoreOrderPickTask
      summary: Start a grocery picking task for an order in a store (M22)
      responses:
        "201":
          description: Order pick task created
  /picking/tasks/{pickTaskId}/items/{orderItemId}/weigh:
    post:
      operationId: weighOrderPickingItem
      summary: Record actual scale weight in grams and recalculate line total in integer BRL cents using HALF_UP rounding (M22)
      responses:
        "200":
          description: Weighed item and updated pick task totals
  /picking/tasks/{pickTaskId}/items/{orderItemId}/substitute:
    post:
      operationId: proposeOrRefundOrderItemSubstitution
      summary: Propose a customer-consented item substitution or mark unavailable for automatic partial refund (M22)
      responses:
        "201":
          description: Substitution proposal or unavailable refund adjustment recorded
  /picking/tasks/{pickTaskId}/complete:
    post:
      operationId: completeOrderPickTask
      summary: Finalize a grocery picking task and reconcile any negative price/weight delta as an M12 refund and M13 ledger journal (M22)
      responses:
        "200":
          description: Pick task completed and financial adjustment reconciled
  /admin/overview:
    get:
      operationId: getAdminBackofficeOverview
      summary: Retrieve Central Admin Backoffice overview (requires staff role + MFA aal2) (M16)
      responses:
        "200":
          description: Admin overview payload
  /admin/staff-scopes:
    post:
      operationId: grantStaffScope
      summary: Grant a staff role scope (requires tech_admin + MFA aal2 + justification; blocks self-grant) (M16)
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      responses:
        "201":
          description: Staff scope granted and audited
  /admin/governance-actions:
    post:
      operationId: executeAdminGovernanceAction
      summary: Execute approval, rejection, suspension, or reactivation decision with MFA aal2 (M16)
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      responses:
        "201":
          description: Governance decision recorded in immutable audit trail
  /admin/audit-logs:
    get:
      operationId: listAdminAuditLogs
      summary: Retrieve read-only immutable audit logs for authorized compliance/admin roles with MFA aal2 (M16)
      responses:
        "200":
          description: List of audit log records
  /finance/overview:
    get:
      operationId: getFinanceBackofficeOverview
      summary: Retrieve Financial Backoffice overview including double-entry ledger balance, settlements, refunds, and reconciliation runs (requires finance/tech_admin + MFA aal2) (M13)
      responses:
        "200":
          description: Finance backoffice overview
  /finance/reconciliation-runs:
    post:
      operationId: runPspReconciliation
      summary: Execute PSP vs internal ledger reconciliation run in BRL integer cents (M13)
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      responses:
        "201":
          description: Reconciliation run completed with matched and discrepancy counts
  /finance/settlements/{settlementId}/execute:
    post:
      operationId: executeSettlementPayout
      summary: Execute merchant or courier settlement payout enforcing MFA aal2, segregation of duties, and honest BLOCKED_NO_PSP status (M13)
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      responses:
        "200":
          description: Settlement status updated (PAID_CONFIRMED or BLOCKED_NO_PSP)
        "403":
          description: Segregation of duties violation or missing MFA aal2
  /logistics/overview:
    get:
      operationId: getLogisticsBackofficeOverview
      summary: Retrieve Logistics & Dispatch Backoffice overview including active delivery tasks, offers, couriers, and GPS telemetry (M14)
      responses:
        "200":
          description: Logistics backoffice overview
  /logistics/offers:
    post:
      operationId: createDeliveryOffer
      summary: Create a delivery task and courier offer hiding exact street until accepted (M14)
      responses:
        "201":
          description: Delivery offer created
  /logistics/offers/{offerId}/accept:
    post:
      operationId: acceptDeliveryOffer
      summary: Accept a delivery offer transactionally enforcing single active courier and revealing full customer address (M14/M11)
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      responses:
        "200":
          description: Offer accepted and full dropoff address revealed
        "409":
          description: Offer expired, courier offline, or task already assigned to another courier
  /logistics/location-samples:
    post:
      operationId: submitCourierLocationSample
      summary: Record courier GPS location sample with staleness and accuracy validation (M14/M11)
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      responses:
        "201":
          description: Location sample recorded with isStaleOrLowAccuracy flag
  /logistics/tasks/{taskId}/complete:
    post:
      operationId: completeDeliveryTaskWithOtp
      summary: Complete a delivery task by verifying the 4-digit customer OTP proof-of-delivery code (M14/M11)
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      responses:
        "200":
          description: Delivery task and order marked DELIVERED
        "409":
          description: Invalid 4-digit OTP code
  /fleets/overview:
    get:
      operationId: getFleetsGovernanceOverview
      summary: Retrieve Third-Party Fleet Operators governance overview and feature_fleet_operators_enabled policy status (M15)
      responses:
        "200":
          description: Fleet operators governance overview
  /support/overview:
    get:
      operationId: getSupportBackofficeOverview
      summary: Retrieve Support & Disputes Backoffice overview with SLA breach counters, internal notes, attachments, and finance escalations (M17)
      responses:
        "200":
          description: Support backoffice overview
  /support/cases:
    get:
      operationId: listSupportCases
      summary: List support cases scoped to the authenticated actor or support staff queue (M17)
      responses:
        "200":
          description: Support cases list
    post:
      operationId: createSupportCase
      summary: Open a new support case with deterministic category-based SLA and priority (M17)
      responses:
        "201":
          description: Support case created
  /support/cases/{caseId}:
    get:
      operationId: getSupportCaseDetail
