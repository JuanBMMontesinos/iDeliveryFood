name: iDeliveryFood CI/CD — Security, Typecheck, Tests, SQL/RLS & Native Mobile Gates (M25)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  security-and-secret-scan:
    name: 1. Security, Anti-Hardcode & Secret Leakage Scan (M23/M25)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Execute secret scan and zero-mock / anti-hardcode scan
        run: |
          node scripts/secret-scan.mjs
          node scripts/security-and-hardcode-scan.mjs

  lint-and-typecheck:
    name: 2. Monorepo Lint & Strict TypeScript Typecheck (14 Projects)
    runs-on: ubuntu-latest
    needs: [security-and-secret-scan]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.8.1

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Run Lint and Typecheck across all packages and web/backend apps
        run: |
          pnpm lint
          pnpm typecheck
          pnpm build

  unit-and-integration-tests:
    name: 3. Unit Coverage (>= 80%), Contract, Integration & E2E Suites (M24)
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.8.1

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Enforce >= 80% Unit Coverage Gate (Lines, Branches, Functions)
        run: pnpm test:unit:coverage

      - name: Run Package Unit & i18n Parity Suites
        run: |
          pnpm --filter @ideliveryfood/contracts test
          pnpm --filter @ideliveryfood/domain test
          pnpm --filter @ideliveryfood/authz test
          pnpm --filter @ideliveryfood/config test
          pnpm --filter @ideliveryfood/i18n test
          pnpm --filter @ideliveryfood/observability test
          pnpm --filter @ideliveryfood/api-client test
          pnpm --filter @ideliveryfood/ui-web test
          pnpm --filter @ideliveryfood/worker test

      - name: Run Live Database Integration & E2E Suites (when DATABASE_URL secret is configured)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -n "$DATABASE_URL" ]; then
            pnpm --filter @ideliveryfood/api test
            pnpm test:e2e
          else
            echo "DATABASE_URL secret not provided in PR context; running offline WCAG/i18n E2E Journey 4."
            pnpm --filter @ideliveryfood/domain build
            pnpm --filter @ideliveryfood/ui-web build
            node --test tests/e2e/journey4-wcag-accessibility-and-portals.e2e.test.mjs
          fi

  sql-migrations-and-rls:
    name: 4. SQL Migrations, Seed Idempotency & 27-Invariant RLS Suite (M02/M24)
    runs-on: ubuntu-latest
    needs: [security-and-secret-scan]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.8.1

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Verify SQL migration ordering, seed structure & RLS test invariants
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          node -e "
            const fs = require('node:fs');
            const migs = fs.readdirSync('supabase/migrations').filter(f => f.endsWith('.sql')).sort();
            if (migs.length < 15) throw new Error('Expected >= 15 SQL migrations');
            const seed = fs.readFileSync('supabase/seed.sql', 'utf8');
            if (!seed.includes('ON CONFLICT') || !seed.includes('is_test_data')) {
              throw new Error('supabase/seed.sql must be idempotent and tag is_test_data = true');
            }
            const rls = fs.readFileSync('supabase/tests/rls_and_constraints_test.sql', 'utf8');
            if (!rls.includes('ROLLBACK') && !rls.includes('DO \$\$')) {
              throw new Error('rls_and_constraints_test.sql must execute transactional assertions');
            }
            console.log('Verified ' + migs.length + ' ordered SQL migrations, seed.sql, and rls_and_constraints_test.sql.');
          "
          if [ -n "$DATABASE_URL" ]; then
            node scripts/db-apply-migrations.mjs --seed --test --check-empty
          fi

  android-native-check:
    name: 5. Android Native Kotlin & Jetpack Compose Verification (customer-android, courier-android)
    runs-on: ubuntu-latest
    needs: [security-and-secret-scan]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify Android Kotlin Sources, Jetpack Compose Accessibility & Bilingual Resources (en + pt-rBR)
        run: |
          node -e "
            const fs = require('node:fs');
            const apps = ['apps/customer-android', 'apps/courier-android'];
            for (const app of apps) {
              const buildGradle = fs.readFileSync(app + '/build.gradle.kts', 'utf8');
              if (!buildGradle.includes('compose')) throw new Error(app + ' must enable Jetpack Compose');
              const enXml = fs.readFileSync(app + '/src/main/res/values/strings.xml', 'utf8');
              const ptXml = fs.readFileSync(app + '/src/main/res/values-pt-rBR/strings.xml', 'utf8');
              const countKeys = (xml) => (xml.match(/<string name=/g) || []).length;
              if (countKeys(enXml) < 10 || countKeys(enXml) !== countKeys(ptXml)) {
                throw new Error(app + ' bilingual strings.xml parity mismatch');
              }
              console.log('Verified Android native app: ' + app + ' (' + countKeys(enXml) + ' bilingual strings)');
            }
          "

  ios-native-check:
    name: 6. iOS Native SwiftUI Build & XCTest Verification (customer-ios, courier-ios)
    runs-on: macos-latest
    needs: [security-and-secret-scan]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Swift Package Manager Build & Tests for customer-ios
        working-directory: apps/customer-ios
        run: swift test

      - name: Run Swift Package Manager Build & Tests for courier-ios
        working-directory: apps/courier-ios
        run: swift test
